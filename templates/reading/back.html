<!-- kotogen:badge -->
<script>
(function () {
  // The level the deck files the note under (`Level::N4`). A note filed under
  // none shows no badge, and the row stays hidden.
  var badge = document.getElementById('card-level');
  var tags = document.getElementById('note-tags');
  if (!badge || !tags) return;
  var level = tags.textContent.trim().split(/\s+/).filter(function (tag) {
    return tag.indexOf('Level::') === 0;
  })[0];
  if (!level) return;
  badge.textContent = level.split('::').pop();
  badge.parentNode.hidden = false;
})();
</script>

<script>
(function () {
  // kotogen:furigana=button
  // On window, for the onclick of the ふ button, the front's or the one the
  // back of a composed document lays.
  window.kotogenToggleFurigana = function () {
    const textKanji = document.getElementById('japanese-text');
    const textFurigana = document.getElementById('japanese-text-furigana');
    const btn = document.getElementById('furigana-btn');

    if (textKanji && textFurigana && btn) {
      if (textKanji.style.display === 'none') {
        textKanji.style.display = 'block';
        textFurigana.style.display = 'none';
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      } else {
        textKanji.style.display = 'none';
        textFurigana.style.display = 'block';
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
      }
    }
  };
  // /kotogen:furigana

  // Anki desktop keeps one page from card to card and runs this script again on
  // every face: the document's listeners are added once, and each acts on the
  // viewer of the book on screen, never on a book gone with its card.
  if (!window.kotogenMinibookListens) {
    window.kotogenMinibookListens = true;
    const relay = function (name) {
      return function (e) {
        const shown = document.getElementById('minibook-container');
        if (shown && shown.kotogenViewer) shown.kotogenViewer[name](e);
      };
    };
    document.addEventListener('keydown', relay('onKeyDown'));
    document.addEventListener('mousemove', relay('onMouseMove'));
    document.addEventListener('mouseup', relay('onMouseUp'));
    document.addEventListener('mousemove', relay('onPointerActivity'));
    document.addEventListener('mousedown', relay('onPointerActivity'));
    document.addEventListener('wheel', relay('onPointerActivity'), { passive: true });
    document.addEventListener('fullscreenchange', relay('onFullscreenChange'));
  }

  const book = document.getElementById('minibook-container');
  // One viewer per book, however many times this script runs over it: the
  // back carries it too.
  if (!book || book.kotogenViewer) return;

  const container = document.getElementById('image-container');
  const counter = document.getElementById('current-page');
  const total = document.getElementById('total-pages');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const firstBtn = document.getElementById('first-btn');
  const lastBtn = document.getElementById('last-btn');
  const fullscreenBtn = book.querySelector('.fullscreen-btn');

  let currentPage = 1;
  let totalPages = 0;
  let images = [];

  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let isDragging = false;
  let dragMoved = false;
  let startX = 0;
  let startY = 0;
  let startTranslateX = 0;
  let startTranslateY = 0;

  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let pinchCenterX = 0;
  let pinchCenterY = 0;
  let pinchPointX = 0;
  let pinchPointY = 0;

  let tapCandidate = false;
  let tapOnImage = false;
  let gestureOnNavBtn = false;
  let tapMoved = false;
  let tapStartX = 0;
  let tapStartY = 0;
  let lastTapTime = 0;
  let lastTapX = 0;
  let lastTapY = 0;
  let singleTapTimer = null;

  let swipeCandidate = false;
  let swipeHorizontal = false;
  let swipeStartX = 0;
  let swipeStartY = 0;

  let touchDevice = false;

  let idleTimer = null;

  const CLICK_ZOOM_SCALE = 2.2;
  const MAX_SCALE = 4;
  const DOUBLE_TAP_MS = 300;
  const DOUBLE_TAP_SLOP = 40;
  const TAP_MOVE_SLOP = 10;
  const SWIPE_MIN_DISTANCE = 60;
  const SWIPE_DIRECTION_RATIO = 1.2;
  const SWIPE_FOLLOW_RATIO = 0.35;
  const SWIPE_FOLLOW_MAX = 80;
  const IDLE_HIDE_MS = 3000;

  // Lays the pages out once they are there. A second pass would count again
  // without the pages that failed to load, which have become placeholders.
  function init() {
    if (!container || images.length) return;
    images = Array.from(container.querySelectorAll('img'));
    totalPages = images.length;
    // A book with no picture in it has nothing to turn, count or enlarge.
    book.classList.toggle('is-empty', totalPages === 0);
    if (totalPages === 0) return;
    if (total) total.textContent = totalPages;

    images.forEach((img, index) => {
      img.className = 'minibook-page';
      img.style.display = index === 0 ? 'block' : 'none';
      img.alt = String(index + 1);

      img.onerror = function() {
        const placeholder = document.createElement('div');
        placeholder.className = 'minibook-page image-placeholder';
        placeholder.style.display = this.style.display;
        placeholder.innerHTML = `
          <div class="placeholder-content">
            <div class="placeholder-icon">頁</div>
            <div class="placeholder-text">${index + 1}</div>
          </div>
        `;

        this.parentNode.replaceChild(placeholder, this);
        images[index] = placeholder;
      };

      if (img.complete && img.naturalWidth === 0) {
        img.onerror();
      }
    });

    updateNavigation();
    book.classList.toggle('single-page', totalPages === 1);
    book.classList.add('is-ready');

    const pane = container.closest('.minibook-viewer') || container;
    pane.addEventListener('mousedown', onMouseDown);
    pane.addEventListener('touchstart', onTouchStart, { passive: false });
    pane.addEventListener('touchmove', onTouchMove, { passive: false });

    pane.addEventListener('touchend', onTouchEnd, { passive: false });
    pane.addEventListener('touchcancel', onTouchEnd);
  }

  function getCurrentImage() {
    return images[currentPage - 1] || null;
  }

  function previousPage() {
    if (currentPage > 1) {
      currentPage--;
      showPage(currentPage);
      updateNavigation();
    }
  }

  function nextPage() {
    if (currentPage < totalPages) {
      currentPage++;
      showPage(currentPage);
      updateNavigation();
    }
  }

  function firstPage() {
    if (totalPages > 0 && currentPage !== 1) {
      currentPage = 1;
      showPage(currentPage);
      updateNavigation();
    }
  }

  function lastPage() {
    if (totalPages > 0 && currentPage !== totalPages) {
      currentPage = totalPages;
      showPage(currentPage);
      updateNavigation();
    }
  }

  function showPage(pageNumber) {
    scale = 1;
    translateX = 0;
    translateY = 0;
    isDragging = false;
    pinchStartDist = 0;
    tapCandidate = false;
    gestureOnNavBtn = false;
    swipeCandidate = false;
    swipeHorizontal = false;
    lastTapTime = 0;
    cancelSingleTap();

    images.forEach((img, index) => {
      img.style.display = index === pageNumber - 1 ? 'block' : 'none';
      img.classList.remove('zoomed', 'dragging');
      img.style.transform = '';
    });
    if (counter) counter.textContent = pageNumber;
    if (viewer.onturn) viewer.onturn(pageNumber);
  }

  function updateNavigation() {
    if (prevBtn) prevBtn.disabled = currentPage === 1;
    if (nextBtn) nextBtn.disabled = currentPage === totalPages;
    if (firstBtn) firstBtn.disabled = currentPage === 1;
    if (lastBtn) lastBtn.disabled = currentPage === totalPages;
  }

  function applyTransform(img) {
    if (scale <= 1.001) {
      img.style.transform = '';
      img.classList.remove('zoomed');
    } else {
      img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      img.classList.add('zoomed');
    }
  }

  function resetZoom() {
    scale = 1;
    translateX = 0;
    translateY = 0;
    const img = getCurrentImage();
    if (img) {
      img.classList.remove('dragging');
      applyTransform(img);
    }
  }

  function zoomAtPoint(img, clientX, clientY, newScale) {
    const rect = img.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const px = (clientX - cx) / scale;
    const py = (clientY - cy) / scale;
    translateX = translateX + px * (scale - newScale);
    translateY = translateY + py * (scale - newScale);
    scale = newScale;
    applyTransform(img);
  }

  function onMouseDown(e) {
    if (touchDevice) return;
    const img = getCurrentImage();
    if (!img || e.target !== img) return;
    e.preventDefault();
    isDragging = true;
    dragMoved = false;
    startX = e.clientX;
    startY = e.clientY;
    startTranslateX = translateX;
    startTranslateY = translateY;
  }

  function onMouseMove(e) {
    if (touchDevice || !isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      dragMoved = true;
    }
    if (scale > 1 && dragMoved) {
      const img = getCurrentImage();
      if (img) {
        img.classList.add('dragging');
        translateX = startTranslateX + dx;
        translateY = startTranslateY + dy;
        applyTransform(img);
      }
    }
  }

  function onMouseUp(e) {
    if (touchDevice || !isDragging) return;
    isDragging = false;
    const img = getCurrentImage();
    if (!img) return;
    img.classList.remove('dragging');
    if (!dragMoved) {
      if (scale > 1) {
        resetZoom();
      } else {
        zoomAtPoint(img, e.clientX, e.clientY, CLICK_ZOOM_SCALE);
      }
    }
  }

  function touchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function touchMidpoint(touches) {
    return {
      x: (touches[0].clientX + touches[1].clientX) / 2,
      y: (touches[0].clientY + touches[1].clientY) / 2
    };
  }

  function onTouchStart(e) {
    touchDevice = true;
    const img = getCurrentImage();
    if (!img) return;

    if (e.touches.length === 1) {
      tapCandidate = true;
      tapOnImage = e.target === img;

      gestureOnNavBtn = !!(e.target.closest && e.target.closest('.nav-btn'));
      tapMoved = false;
      tapStartX = e.touches[0].clientX;
      tapStartY = e.touches[0].clientY;
      swipeCandidate = scale <= 1.001;
      swipeHorizontal = false;
      swipeStartX = tapStartX;
      swipeStartY = tapStartY;
    } else {
      tapCandidate = false;
      gestureOnNavBtn = false;
      swipeCandidate = false;
      swipeHorizontal = false;
    }

    if (e.touches.length === 2) {
      e.preventDefault();
      isDragging = false;
      pinchStartDist = touchDistance(e.touches);
      pinchStartScale = scale;
      const mid = touchMidpoint(e.touches);
      const rect = img.getBoundingClientRect();

      pinchCenterX = rect.left + rect.width / 2 - translateX;
      pinchCenterY = rect.top + rect.height / 2 - translateY;
      pinchPointX = (mid.x - pinchCenterX - translateX) / scale;
      pinchPointY = (mid.y - pinchCenterY - translateY) / scale;
      img.classList.add('dragging');
    } else if (e.touches.length === 1 && scale > 1) {
      e.preventDefault();
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startTranslateX = translateX;
      startTranslateY = translateY;
      img.classList.add('dragging');
    }
  }

  function onTouchMove(e) {
    const img = getCurrentImage();
    if (!img) return;

    if (tapCandidate && e.touches.length >= 1) {
      const dx = e.touches[0].clientX - tapStartX;
      const dy = e.touches[0].clientY - tapStartY;
      if (Math.abs(dx) > TAP_MOVE_SLOP || Math.abs(dy) > TAP_MOVE_SLOP) {
        tapMoved = true;
      }
    }

    if (e.touches.length === 2 && pinchStartDist > 0) {
      e.preventDefault();
      let newScale = pinchStartScale * touchDistance(e.touches) / pinchStartDist;
      newScale = Math.min(MAX_SCALE, Math.max(1, newScale));
      const mid = touchMidpoint(e.touches);
      scale = newScale;

      translateX = mid.x - pinchCenterX - newScale * pinchPointX;
      translateY = mid.y - pinchCenterY - newScale * pinchPointY;
      applyTransform(img);
    } else if (isDragging && e.touches.length === 1 && scale > 1) {
      e.preventDefault();
      translateX = startTranslateX + (e.touches[0].clientX - startX);
      translateY = startTranslateY + (e.touches[0].clientY - startY);
      applyTransform(img);
    } else if (swipeCandidate && e.touches.length === 1) {
      const dx = e.touches[0].clientX - swipeStartX;
      const dy = e.touches[0].clientY - swipeStartY;

      if (!swipeHorizontal
          && Math.abs(dx) > TAP_MOVE_SLOP
          && Math.abs(dx) > Math.abs(dy) * SWIPE_DIRECTION_RATIO) {
        swipeHorizontal = true;
        img.classList.add('dragging');
      }
      if (swipeHorizontal) {
        e.preventDefault();

        const offset = Math.max(-SWIPE_FOLLOW_MAX,
          Math.min(SWIPE_FOLLOW_MAX, dx * SWIPE_FOLLOW_RATIO));
        img.style.transform = `translateX(${offset}px)`;
      }
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length < 2) {
      pinchStartDist = 0;
    }
    if (e.touches.length === 0) {
      isDragging = false;
      const img = getCurrentImage();
      if (img) {
        img.classList.remove('dragging');
      }

      if (scale <= 1.05) {
        resetZoom();
      }

      if (handleSwipeEnd(e)) {
        tapCandidate = false;
        gestureOnNavBtn = false;
        lastTapTime = 0;
        return;
      }

      handleTapEnd(e);
    }
  }

  function handleSwipeEnd(e) {
    const touch = e.changedTouches && e.changedTouches[0];
    const wasSwiping = swipeCandidate && swipeHorizontal && touch;
    swipeCandidate = false;
    swipeHorizontal = false;
    if (!wasSwiping) return false;

    const img = getCurrentImage();
    if (img) {
      img.classList.remove('dragging');
      img.style.transform = '';
    }

    const dx = touch.clientX - swipeStartX;
    if (Math.abs(dx) >= SWIPE_MIN_DISTANCE) {
      e.preventDefault();

      if (dx < 0) {
        nextPage();
      } else {
        previousPage();
      }
    }
    return true;
  }

  function handleTapEnd(e) {
    const touch = e.changedTouches && e.changedTouches[0];
    const onNavBtn = gestureOnNavBtn;
    gestureOnNavBtn = false;
    if (!tapCandidate || tapMoved || !touch || onNavBtn) {
      tapCandidate = false;
      lastTapTime = 0;
      return;
    }
    tapCandidate = false;

    const now = Date.now();
    const isDouble = now - lastTapTime < DOUBLE_TAP_MS
      && Math.abs(touch.clientX - lastTapX) < DOUBLE_TAP_SLOP
      && Math.abs(touch.clientY - lastTapY) < DOUBLE_TAP_SLOP;

    if (isDouble) {
      e.preventDefault();
      lastTapTime = 0;
      cancelSingleTap();
      if (!tapOnImage) return;
      const img = getCurrentImage();
      if (!img) return;
      if (scale > 1) {
        resetZoom();
      } else {
        zoomAtPoint(img, touch.clientX, touch.clientY, CLICK_ZOOM_SCALE);
      }
    } else {
      lastTapTime = now;
      lastTapX = touch.clientX;
      lastTapY = touch.clientY;

      if (isFullscreenActive()) {
        e.preventDefault();
        cancelSingleTap();
        singleTapTimer = setTimeout(function() {
          singleTapTimer = null;
          toggleChrome();
        }, DOUBLE_TAP_MS);
      }
    }
  }

  function cancelSingleTap() {
    if (singleTapTimer !== null) {
      clearTimeout(singleTapTimer);
      singleTapTimer = null;
    }
  }

  function toggleChrome() {
    book.classList.toggle('chrome-hidden');
  }

  function showChrome() {
    cancelSingleTap();
    clearIdleHide();
    book.classList.remove('chrome-hidden');
  }

  function hasFinePointer() {
    return !touchDevice
      && typeof window.matchMedia === 'function'
      && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  }

  function armIdleHide() {
    clearIdleHide();
    if (!hasFinePointer()) return;
    idleTimer = setTimeout(hideChromeIfImmersive, IDLE_HIDE_MS);
  }

  function clearIdleHide() {
    if (idleTimer !== null) {
      clearTimeout(idleTimer);
      idleTimer = null;
    }
  }

  function hideChromeIfImmersive() {
    idleTimer = null;
    if (!isFullscreenActive()) return;

    const controls = book.querySelector('.minibook-controls');
    if (controls && controls.matches && controls.matches(':hover')) return;
    book.classList.add('chrome-hidden');
  }

  function onPointerActivity() {
    if (!hasFinePointer() || !isFullscreenActive()) return;
    book.classList.remove('chrome-hidden');
    armIdleHide();
  }

  function isFullscreenActive() {
    return document.fullscreenElement === book
      || book.classList.contains('css-fullscreen');
  }

  // The button says whether it is on, and the book wears it as a class,
  // whichever way full screen was reached: a WebView that does not know
  // `:fullscreen` drops every rule naming it.
  function markFullscreen() {
    const on = isFullscreenActive();
    book.classList.toggle('is-full-screen', on);
    if (fullscreenBtn) fullscreenBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function toggleFullscreen() {
    showChrome();

    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (book.classList.contains('css-fullscreen')) {
      book.classList.remove('css-fullscreen');
    } else {
      let requested = false;
      try {
        if (book.requestFullscreen) {
          const promise = book.requestFullscreen();
          requested = true;
          if (promise && promise.catch) {
            promise.catch(() => {
              book.classList.add('css-fullscreen');
              markFullscreen();
            });
          }
        }
      } catch (err) {
        requested = false;
      }
      if (!requested) {
        book.classList.add('css-fullscreen');
      }
      armIdleHide();
    }
    markFullscreen();
  }

  // The keys of the book: never one typed into a field or held with a
  // modifier. Home and End go to either end of it in full screen only:
  // elsewhere they scroll the card, as everywhere.
  function onKeyDown(e) {
    const target = e.target;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (target && (target.isContentEditable
        || (target.closest && target.closest('input, textarea, select')))) return;
    onPointerActivity();
    const turning = totalPages > 1;
    const ends = turning && isFullscreenActive();
    switch(e.key) {
      case 'ArrowLeft':
        if (!turning) break;
        e.preventDefault();
        previousPage();
        break;
      case 'ArrowRight':
        if (!turning) break;
        e.preventDefault();
        nextPage();
        break;
      case 'Home':
        if (!ends) break;
        e.preventDefault();
        firstPage();
        break;
      case 'End':
        if (!ends) break;
        e.preventDefault();
        lastPage();
        break;
      case 'Escape':
        if (document.fullscreenElement) {
          document.exitFullscreen();
        }
        book.classList.remove('css-fullscreen');
        showChrome();
        markFullscreen();
        break;
    }
  }

  function onFullscreenChange() {
    if (document.fullscreenElement) {
      armIdleHide();
    } else {
      showChrome();
    }
    markFullscreen();
  }

  if (prevBtn) prevBtn.addEventListener('click', previousPage);
  if (nextBtn) nextBtn.addEventListener('click', nextPage);
  if (firstBtn) firstBtn.addEventListener('click', firstPage);
  if (lastBtn) lastBtn.addEventListener('click', lastPage);
  if (fullscreenBtn) fullscreenBtn.addEventListener('click', toggleFullscreen);

  // What the listeners of the document reach, and what the back calls to open
  // the book at the page of the answer; `onturn` hears of every page shown.
  const viewer = book.kotogenViewer = {
    onKeyDown: onKeyDown,
    onMouseMove: onMouseMove,
    onMouseUp: onMouseUp,
    onPointerActivity: onPointerActivity,
    onFullscreenChange: onFullscreenChange,
    turnTo: function (page) {
      init();
      if (!(page >= 1 && page <= totalPages)) return;
      currentPage = page;
      showPage(page);
      updateNavigation();
    },
    onturn: null
  };

  // `DOMContentLoaded` is still to come only where the card is a page of its
  // own (AnkiDroid); the page Anki desktop keeps has loaded long before.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  setTimeout(init, 100);
})();
</script>

<script>
(function () {
  // kotogen:order=daily
  // Anki's "Next day starts at" (Preferences > Review).
  var ROLLOVER_HOUR = 4;
  // /kotogen:order
  // kotogen:markers=letters
  var LETTERS = 'ABCDEFGH';
  // /kotogen:markers
  // kotogen:markers=digits
  var LETTERS = '12345678';
  // /kotogen:markers

  // kotogen:order=daily
  function ankiDay() {
    var d = new Date(Date.now() - ROLLOVER_HOUR * 3600000);
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  // /kotogen:order

  var imul = Math.imul || function (a, b) {
    var al = a & 0xffff, bl = b & 0xffff;
    return (al * bl + ((((a >>> 16) * bl + al * (b >>> 16)) << 16) >>> 0)) | 0;
  };

  function hash(text) {
    var h = 5381;
    for (var i = 0; i < text.length; i++) {
      h = ((h << 5) - h + text.charCodeAt(i)) | 0;
    }
    return h >>> 0;
  }

  function seeded(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = imul(a ^ (a >>> 15), 1 | a);
      t = ((t + imul(t ^ (t >>> 7), 61 | t)) | 0) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // kotogen:choices=four
  function howMany(total) { return total; }
  // /kotogen:choices
  // kotogen:choices=two
  function howMany(total) { return Math.min(2, total); }
  // /kotogen:choices
  // kotogen:choices=none
  function howMany() { return 0; }
  // /kotogen:choices
  // kotogen:choices=alternate

  function howMany(total, seed) {
    var rank = /_(\d+)\s*\|/.exec(seed ? seed.textContent : '');
    return (!rank || parseInt(rank[1], 10) % 2 === 1) ? total : 0;
  }
  // /kotogen:choices

  function shuffle() {
    var box = document.querySelector('.choices-container');
    if (!box || box.classList.contains('is-ready')) return box;

    var choices = [];
    var all = box.querySelectorAll('.choice');
    for (var n = 0; n < all.length; n++) choices.push(all[n]);
    if (choices.length < 2) return box;

    var seed = box.querySelector('.choices-seed');
    // kotogen:order=daily
    var rand = seeded(hash((seed ? seed.textContent : '') + '|' + ankiDay()));
    // /kotogen:order
    // kotogen:order=fixed
    var rand = seeded(hash(seed ? seed.textContent : ''));
    // /kotogen:order

    var kept = howMany(choices.length, seed);
    if (kept < 2) {
      if (box.parentNode) box.parentNode.removeChild(box);
      return null;
    }

    while (choices.length > kept) {
      var candidates = [];

      for (var d = 0; d < choices.length; d++) {
        if (!choices[d].getAttribute('data-role')) candidates.push(d);
      }
      if (!candidates.length) break;
      var dropped = candidates[Math.floor(rand() * candidates.length)];
      if (choices[dropped].parentNode) choices[dropped].parentNode.removeChild(choices[dropped]);
      choices.splice(dropped, 1);
    }

    for (var i = choices.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var tmp = choices[i]; choices[i] = choices[j]; choices[j] = tmp;
    }
    for (var k = 0; k < choices.length; k++) {
      // kotogen:markers=letters|digits
      choices[k].querySelector('.choice-letter').textContent = LETTERS.charAt(k);
      // /kotogen:markers
      box.appendChild(choices[k]);
    }

    box.classList.add('is-ready');
    return box;
  }

  var box = shuffle();
  if (box && box.classList.contains('is-ready')) {
    box.classList.add('is-revealed');
    // Nothing is left to pick: the choices go back to being text.
    var shown = box.querySelectorAll('.choice');
    for (var c = 0; c < shown.length; c++) {
      shown[c].removeAttribute('tabindex');
      shown[c].removeAttribute('role');
      shown[c].removeAttribute('aria-pressed');
    }

    var written = document.querySelector('.answer-container');
    if (written && written.parentNode) written.parentNode.removeChild(written);
  }
})();
</script>

<script>
(function () {
  // The book opens where the answer is read: what the green rule does to the
  // line of a text, said in the unit this card shows. Nothing is hidden by it -
  // the counter says which page (4 / 8) and the arrows go back to the first.
  var raw = document.querySelector('.key-page');
  var page = parseInt(((raw ? raw.textContent : '') || '').trim(), 10);
  var book = document.getElementById('minibook-container');
  if (!(page > 0) || !book) return;

  function turnTo() {
    // A card rated within these 150 ms has gone, and the book on screen is
    // the next card's: it opens where its own card says.
    if (document.getElementById('minibook-container') !== book) return;
    var viewer = book.kotogenViewer;
    if (!viewer) return;
    // Every page the viewer shows comes through `onturn`, so turning by hand
    // takes the mark off: arrow, jump, keyboard or swipe.
    viewer.onturn = function (shown) {
      book.classList.toggle('at-key-page', shown === page);
    };
    viewer.turnTo(page);
  }

  // After the viewer has laid its pages out (100 ms), and again on loading
  // where the card is a page of its own and got here before it.
  setTimeout(turnTo, 150);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(turnTo, 150);
    });
  }
})();
</script>

<script>
(function () {
  var container = document.querySelector('.text-container');
  if (!container) return;

  function splitLines(el) {
    if (!el) return [];
    return el.innerHTML
      .split(/<br\s*\/?>/i)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length; });
  }

  var trans = splitLines(document.querySelector('.trans-raw'));
  var keyRaw = document.querySelector('.key-raw');

  var keyRank = parseInt(((keyRaw ? keyRaw.textContent : '') || '').trim(), 10);
  if (!trans.length && !(keyRank > 0)) return;

  var views = container.querySelectorAll('.japanese-text, .japanese-text-furigana');
  var placed = false;

  for (var v = 0; v < views.length; v++) {
    var view = views[v];

    if (view.classList.contains('is-lined')) continue;
    var jp = splitLines(view);
    if (!jp.length) continue;

    view.innerHTML = '';
    for (var i = 0; i < jp.length; i++) {
      var line = document.createElement('div');
      line.className = (i + 1 === keyRank) ? 'line is-key' : 'line';

      var text = document.createElement('div');
      text.className = 'jp';
      text.innerHTML = jp[i];
      line.appendChild(text);

      if (trans[i]) {
        var translation = document.createElement('div');
        translation.className = 'trans';
        // Not Japanese: the language of the cards, which the template does
        // not know - "unknown" rather than the Japanese of the line above.
        translation.lang = '';
        translation.innerHTML = trans[i];
        line.appendChild(translation);
        placed = true;
      }
      view.appendChild(line);
    }
    view.classList.add('is-lined');
  }

  if (!placed) return;

  // kotogen:translation=on-click|at-once

  // The 訳 goes in front of the ふ, in the same pill: the ふ keeps the place it
  // had on the front, and the two aids to the text read as one family. The
  // front held its place empty; it takes that place rather than a new one.
  var bar = container.querySelector('.text-aids');
  if (!bar || bar.querySelector('.tr-toggle')) return;

  var toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'aid tr-toggle';
  toggle.textContent = '訳';
  var held = bar.querySelector('.is-placeholder');
  if (held) {
    bar.replaceChild(toggle, held);
  } else {
    bar.insertBefore(toggle, bar.firstChild);
  }

  function showTranslation(shown) {
    container.classList.toggle('show-trans', shown);
    toggle.classList.toggle('active', shown);
    toggle.setAttribute('aria-pressed', shown ? 'true' : 'false');
  }
  // /kotogen:translation
  // kotogen:translation=on-click
  showTranslation(false);
  // /kotogen:translation
  // kotogen:translation=at-once
  showTranslation(true);
  // /kotogen:translation
  // kotogen:translation=on-click|at-once
  toggle.addEventListener('click', function () {
    showTranslation(!toggle.classList.contains('active'));
  });
  // /kotogen:translation
})();
</script>

<div class="source-section">{{Source}}</div>
<script>
(function () {
  var MAX_LENGTH = 48;

  var box = document.querySelector('.source-section');
  if (!box) return;
  var text = box.textContent.trim();

  var head = /^(https?:\/\/\S+)(.*)$/.exec(text);
  var tail = head ? null : /^(.*\S)\s+(https?:\/\/\S+)$/.exec(text);
  if (!head && !tail) return;

  var readable, rest = '';
  if (head) {
    readable = head[1].replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
    if (readable.length > MAX_LENGTH) readable = readable.slice(0, MAX_LENGTH - 1) + '…';
    rest = head[2].trim();
  } else {
    readable = tail[1];
  }

  var link = document.createElement('a');
  link.href = head ? head[1] : tail[2];
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = readable;

  box.textContent = '';
  box.appendChild(link);
  if (rest) box.appendChild(document.createTextNode(' ' + rest));
})();
</script>
