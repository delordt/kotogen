name: CI

# Every branch, a throwaway one included; not a tag, which names a commit its
# branch has already had tested.
on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref makes the run still going on the older one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The tests read the repository and write nothing anywhere: the token of the
# run gets that much and no more, whatever the defaults of the repository say.
permissions:
  contents: read

# The actions are pinned to the commit of a release, not to a tag a release can
# move: what runs is what was read. Dependabot brings the commit and the version
# written beside it up to date together. Nothing here pushes, so the token is not
# left behind in the clone either (`persist-credentials`).
jobs:
  # Once, and not on every system: what the linter reads is the same everywhere.
  # Its version is the one of the dev extra, in pyproject.toml.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        run: pip install "ruff==0.17.3"
      - name: Lint
        run: ruff check src tests

  test:
    # All three systems, not only the one used for development: what differs
    # from one OS to the other (user folders, key reading, console) is simulated
    # in the tests, but only a real run says whether the rest holds. Japanese and
    # accented text are at stake too: Windows encodes its console in cp1252,
    # and output that was not reconfigured fails there.
    runs-on: ${{ matrix.os }}
    # A run takes a minute or two. One still going after fifteen is waiting
    # for an answer nobody will type, and is better stopped than left for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The oldest Python the program supports, the one it is developed on,
        # and the most recent.
        python-version: ["3.10", "3.13", "3.14"]
        # macOS once: what differs there (its folders, its clipboard, its
        # terminal) does not depend on the Python.
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The cache holds pip's downloads only: pip still resolves every version
      # against the index, so a run tests what a fresh install would get.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The pdf extra is the one whose code the tests run for real: the pages
      # rendered as images, the ink of a scanned frame counted with numpy. The
      # tests of the other extras replace what those packages do, and would
      # gain nothing from them but a longer install.
      - name: Install
        run: pip install -e ".[dev,pdf]"
      - name: Tests
        run: pytest -q
