name: Bug
description: Something kotogen does wrong, or stops on.
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The command, or the way you went through the menu.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: >
        The output, from the first line that went wrong. For an "unforeseen" error,
        run it again with KOTOGEN_DEBUG=1 and paste the traceback too.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Version
      description: What `kotogen --version` says.
      placeholder: kotogen 1.0.0
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: checkboxes
    id: key
    attributes:
      label: Before sending
      options:
        - label: Nothing above holds an API key.
          required: true
